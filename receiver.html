<!DOCTYPE html>
<html lang="utf-8">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HID Wireless Converter · Receiver</title>
    <link rel="stylesheet" href="r.css">
</head>
<body>

<!-- 顶部导航 -->
<header class="topbar">
    <div class="topbar-inner">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">HID Wireless</span>
            <span class="brand-sub">Receiver</span>
        </div>
        <nav class="topnav">
            <a href="shortcuts.html">⌨️ 键盘快捷键</a>
            <a href="index.html">🔌 有线转无线</a>
            <a href="p42.html">P42 帮助</a>
            <a href="receiver.html" class="active">接收器驱动</a>
        </nav>
        <div class="topbar-actions">
            <button id="themeToggle" class="icon-btn" title="切换主题">🌙</button>
        </div>
    </div>
</header>

<div class="layout">

    <!-- 左侧边栏 -->
    <aside class="sidebar">

        <!-- 连接状态卡片 -->
        <section class="card">
            <div class="card-head">
                <span class="card-title">串口连接</span>
                <span id="connStatus" class="status status-off">未连接</span>
            </div>
            <button id="connect" class="btn btn-primary btn-block">连接串口</button>
        </section>

     <!-- 接收器地址卡片 -->
<section class="card">
    <div class="card-head">
        <span class="card-title">接收器地址</span>
    </div>
    <div class="radio-group">
        <label class="radio-pill">
            <input type="radio" name="channel" value="1" checked>
            <span>地址 A</span>
        </label>
        <label class="radio-pill">
            <input type="radio" name="channel" value="2">
            <span>地址 B</span>
        </label>
    </div>
</section>

<!-- 电池电量卡片（新增） -->
<section class="card battery-card">
    <div class="card-head">
        <span class="card-title">🔋 电池电量</span>
        <span id="batteryValue" class="battery-percent">--%</span>
    </div>
    <div class="battery-body">
        <div class="battery-icon">
            <div class="battery-level" id="batteryLevel" style="width: 0%;"></div>
        </div>
        <div class="battery-info">
            <span id="batteryStatus" class="battery-status">等待查询…</span>
        </div>
    </div>
    <button class="cmd cmd-channel btn-block" data-cmd="adc_measure">🔄 刷新电量</button>
</section>

        <!-- 快捷命令卡片 -->
        <section class="card">
            <div class="card-head">
                <span class="card-title">快捷命令</span>
            </div>
            <div class="cmd-grid">
                <button class="cmd cmd-system" data-cmd="nordic">NORDIC 测试</button>
                <button class="cmd cmd-system" data-cmd="bootloader_jump">进入刷机模式</button>
                <button class="cmd cmd-system" data-cmd="logqf open">打开日志</button>
                <button class="cmd cmd-system" data-cmd="logqf close">关闭日志</button>
            </div>
        </section>

    </aside>

    <!-- 主区域：终端 -->
    <main class="terminal-pane">
        <div class="terminal-bar">
            <span class="terminal-title">终端输出</span>
            <div class="terminal-actions">
                <button id="clearLog" class="btn btn-ghost btn-sm">清空</button>
                <button id="exportLog" class="btn btn-ghost btn-sm">导出</button>
            </div>
        </div>
        <textarea id="log" rows="20" placeholder="等待串口数据…" readonly></textarea>

        <div class="sendbar">
            <input id="input" type="text" placeholder="输入命令后回车发送…">
            <button id="send" class="btn btn-primary">发送</button>
        </div>
    </main>

</div>

<script src="r.js"></script>
</body>
</html>
